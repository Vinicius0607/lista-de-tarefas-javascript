<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lista de tarefas desenvolvida para praticar HTML, CSS, JavaScript e localStorage.">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="app" aria-labelledby="titulo">
      <header class="app-header">
        <p class="eyebrow">Projeto de estudo</p>
        <h1 id="titulo">Lista de Tarefas</h1>
        <p>Organize suas tarefas e acompanhe o que já foi concluído.</p>
      </header>

      <form id="task-form" class="task-form">
        <label class="sr-only" for="task-input">Nova tarefa</label>
        <input id="task-input" type="text" placeholder="Digite uma tarefa..." maxlength="120" autocomplete="off" required>
        <button type="submit">Adicionar</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filtrar tarefas">
          <button class="filter active" data-filter="all" type="button">Todas</button>
          <button class="filter" data-filter="pending" type="button">Pendentes</button>
          <button class="filter" data-filter="completed" type="button">Concluídas</button>
        </div>
        <button id="clear-completed" class="text-button" type="button">Limpar concluídas</button>
      </div>

      <p id="task-counter" class="counter" aria-live="polite">0 tarefas</p>
      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">Nenhuma tarefa cadastrada.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
